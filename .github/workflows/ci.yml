name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Run ShellCheck
        run: make lint

      - name: Verify build assembly
        run: ./build.sh --check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test suite
        run: make test

  fedora-validate:
    name: Fedora Container Validation (${{ matrix.fedora_image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora_image:
          - "fedora:latest"
          - "fedora:42"
          - "fedora:rawhide"
    container: ${{ matrix.fedora_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: dnf install -y ShellCheck make bash diffutils

      - name: Run ShellCheck
        run: make lint

      - name: Verify build assembly
        run: ./build.sh --check

      - name: Run test suite
        run: make test

      - name: Validate dry run
        run: ALLOW_ROOT=true bash setup.sh --dry-run --profile minimal
